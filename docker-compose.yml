# InkWeaver 本地基础设施（MVP 开发）
#
# 首次 / 重置数据库：
#   1. 自备根 .env（POSTGRES_PASSWORD、REDIS_PASSWORD，见 docs/运维.md）
#   2. docker compose down -v
#   3. docker compose up -d
#   4. 将 .env 中密码同步到 apps/server/.env
#
# Mailhog Web UI: http://localhost:8025
# SMTP: localhost:1025

services:
  postgres:
    image: postgres:16-alpine
    container_name: inkweaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: syncbox_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - inkweaver_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syncbox_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inkweaver-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: inkweaver-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  inkweaver_pg_data:
