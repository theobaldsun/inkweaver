<svg viewBox="0 0 680 510" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img">
  <title>Run 状态机（中文注解）</title>
  <desc>状态(框)由事件(标签)推进。CREATED 为初始态无事件；ENQUEUE/START/CONFIRMATION_ACCEPTED 无同名状态；三个终态仅由已核验的结算事件到达。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="30" font-size="15" font-weight="500" fill="#1f2937">Run 状态机：状态(框)由事件(标签)推进 · 中文注解</text>

  <rect x="40" y="60" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="95" y="80" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">CREATED</text>
  <text x="95" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">初始态</text>

  <rect x="200" y="60" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="255" y="80" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">QUEUED</text>
  <text x="255" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">已入队</text>

  <rect x="350" y="60" width="120" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="410" y="80" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">RUNNING</text>
  <text x="410" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">执行中</text>

  <rect x="520" y="60" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="580" y="80" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">COMPLETED</text>
  <text x="580" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">成功·终态</text>

  <rect x="350" y="160" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="430" y="178" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">WAITING_</text>
  <text x="430" y="196" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">CONFIRMATION</text>

  <rect x="520" y="160" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="580" y="180" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">FAILED</text>
  <text x="580" y="200" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">失败·终态</text>

  <rect x="520" y="234" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="580" y="254" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">CANCELLED</text>
  <text x="580" y="274" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">取消·终态</text>

  <rect x="520" y="308" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="580" y="328" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">TIMED_OUT</text>
  <text x="580" y="348" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">超时·终态</text>

  <line x1="150" y1="88" x2="198" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="174" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle">ENQUEUE 入队</text>
  <line x1="310" y1="88" x2="348" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="329" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle">START 开始</text>
  <line x1="470" y1="88" x2="518" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="494" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle">COMPLETE 完成</text>
  <line x1="410" y1="116" x2="410" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="138" font-size="12" fill="#5F5E5A">WAIT_FOR_CONFIRMATION</text>
  <text x="430" y="152" font-size="12" fill="#5F5E5A">（工具需确认）</text>
  <path d="M350 196 C 260 240, 205 160, 245 118" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="224" font-size="12" fill="#5F5E5A" text-anchor="middle">CONFIRMATION_</text>
  <text x="200" y="238" font-size="12" fill="#5F5E5A" text-anchor="middle">ACCEPTED 确认重排</text>
  <line x1="465" y1="108" x2="516" y2="162" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="470" y="135" font-size="12" fill="#5F5E5A" text-anchor="middle">FAIL 失败</text>
  <line x1="470" y1="114" x2="516" y2="236" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="472" y="185" font-size="12" fill="#5F5E5A" text-anchor="middle">CANCEL_SETTLED</text>
  <text x="472" y="199" font-size="12" fill="#5F5E5A" text-anchor="middle">结算后取消</text>
  <line x1="470" y1="120" x2="516" y2="310" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="235" font-size="12" fill="#5F5E5A" text-anchor="middle">TIMEOUT_SETTLED</text>
  <text x="478" y="249" font-size="12" fill="#5F5E5A" text-anchor="middle">结算后超时</text>

  <rect x="40" y="372" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="384" font-size="12" fill="#5F5E5A">初始态</text>
  <rect x="170" y="372" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="384" font-size="12" fill="#5F5E5A">非终态</text>
  <rect x="300" y="372" width="14" height="14" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="320" y="384" font-size="12" fill="#5F5E5A">成功终态</text>
  <rect x="440" y="372" width="14" height="14" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="460" y="384" font-size="12" fill="#5F5E5A">失败/取消/超时终态</text>

  <text x="40" y="414" font-size="12" fill="#5F5E5A">圆角框 = 状态(status)；连线标签 = 事件(event，已核验事实)。</text>
  <text x="40" y="432" font-size="12" fill="#5F5E5A">CREATED 无对应事件（插入即设初值）；ENQUEUE / START / CONFIRMATION_ACCEPTED 无同名状态。</text>
  <text x="40" y="450" font-size="12" fill="#5F5E5A">三个终态只能由"已核验的结算事件"到达：先记意图/超时 → 停执行 → 在途调用收尾 → 才落终态（详见 §8）。</text>
  <text x="40" y="468" font-size="12" fill="#5F5E5A">确认流：RUNNING 经 WAIT_FOR_CONFIRMATION 转入 WAITING_CONFIRMATION 时，Run 被"故意"卡在非终态，等用户 decide。</text>
</svg>
