<svg viewBox="0 0 680 510" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif" role="img">
  <title>ToolCall 状态机（中文注解）</title>
  <desc>状态(框)由事件(标签)推进。PREPARED 为初始态；RESOURCES_APPROVED 视 requiresConfirmation 分叉；START 递增尝试次数；结果不明须对账；取消/过期走向终态。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="30" font-size="15" font-weight="500" fill="#1f2937">ToolCall 状态机：状态(框)由事件(标签)推进 · 中文注解</text>

  <rect x="40" y="60" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="105" y="80" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">PREPARED</text>
  <text x="105" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">初始态</text>

  <rect x="210" y="60" width="110" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="265" y="80" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">READY</text>
  <text x="265" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">已授权</text>

  <rect x="380" y="60" width="130" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="445" y="80" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">EXECUTING</text>
  <text x="445" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">执行中</text>

  <rect x="540" y="60" width="120" height="56" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="600" y="80" font-size="13" font-weight="500" fill="#173404" text-anchor="middle" dominant-baseline="central">SUCCEEDED</text>
  <text x="600" y="100" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">成功·终态</text>

  <rect x="210" y="160" width="150" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="285" y="178" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">WAITING_</text>
  <text x="285" y="196" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">CONFIRMATION</text>

  <rect x="380" y="170" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="450" y="190" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">OUTCOME_UNKNOWN</text>
  <text x="450" y="210" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">结果不明</text>

  <rect x="380" y="260" width="140" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="450" y="280" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">RETRY_WAIT</text>
  <text x="450" y="300" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">退避中</text>

  <rect x="540" y="150" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="600" y="170" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">FAILED</text>
  <text x="600" y="190" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">失败·终态</text>

  <rect x="540" y="224" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="600" y="244" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">CANCELLED</text>
  <text x="600" y="264" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">取消·终态</text>

  <rect x="540" y="300" width="120" height="56" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="600" y="320" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">EXPIRED</text>
  <text x="600" y="340" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">过期·终态</text>

  <line x1="170" y1="88" x2="208" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="189" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle">RESOURCES_APPROVED</text>
  <text x="189" y="100" font-size="11" fill="#5F5E5A" text-anchor="middle">授权通过</text>
  <line x1="130" y1="116" x2="268" y2="158" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="138" font-size="12" fill="#5F5E5A">需确认</text>
  <path d="M280 160 C 285 125, 270 118, 262 114" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="138" font-size="12" fill="#5F5E5A">CONFIRMED 确认</text>
  <line x1="320" y1="88" x2="378" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="349" y="80" font-size="12" fill="#5F5E5A" text-anchor="middle">START 执行</text>
  <text x="349" y="100" font-size="11" fill="#5F5E5A" text-anchor="middle">次数+1</text>
  <line x1="510" y1="92" x2="538" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="524" y="78" font-size="12" fill="#5F5E5A" text-anchor="middle">SUCCEEDED</text>
  <line x1="510" y1="100" x2="538" y2="154" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="524" y="128" font-size="12" fill="#5F5E5A" text-anchor="middle">FAILED</text>
  <line x1="445" y1="116" x2="445" y2="168" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="144" font-size="12" fill="#5F5E5A">OUTCOME_UNKNOWN</text>
  <text x="455" y="158" font-size="11" fill="#5F5E5A">结果不明</text>
  <line x1="445" y1="198" x2="445" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="228" font-size="12" fill="#5F5E5A">RETRY_SCHEDULED</text>
  <text x="455" y="242" font-size="11" fill="#5F5E5A">重试调度</text>
  <path d="M515 288 C 525 210, 360 165, 322 114" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="210" font-size="12" fill="#5F5E5A">RETRY_DUE 重排</text>
  <line x1="510" y1="110" x2="538" y2="228" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="524" y="175" font-size="12" fill="#5F5E5A" text-anchor="middle">取消</text>
  <text x="524" y="189" font-size="11" fill="#5F5E5A" text-anchor="middle">CANCEL_REQ</text>
  <line x1="510" y1="120" x2="538" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="524" y="218" font-size="12" fill="#5F5E5A" text-anchor="middle">EXPIRED</text>
  <text x="524" y="232" font-size="11" fill="#5F5E5A" text-anchor="middle">过期</text>

  <rect x="40" y="372" width="14" height="14" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="60" y="384" font-size="12" fill="#5F5E5A">初始态</text>
  <rect x="170" y="372" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="190" y="384" font-size="12" fill="#5F5E5A">非终态</text>
  <rect x="300" y="372" width="14" height="14" rx="2" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="320" y="384" font-size="12" fill="#5F5E5A">成功终态</text>
  <rect x="440" y="372" width="14" height="14" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="460" y="384" font-size="12" fill="#5F5E5A">失败/取消/过期终态</text>

  <text x="40" y="414" font-size="12" fill="#5F5E5A">框 = 状态；标签 = 事件。Attempt 是每次执行(attemptNumber)，状态由执行链路维护，非独立状态机。</text>
  <text x="40" y="432" font-size="12" fill="#5F5E5A">START 时 sideEffect 置 unknown：取消不能当"已无事发生"（可能已写副作用）。</text>
  <text x="40" y="450" font-size="12" fill="#5F5E5A">结果不明(OUTCOME_UNKNOWN)必须重试或对账后才能终态，不能凭空声明成功/失败。</text>
  <text x="40" y="468" font-size="12" fill="#5F5E5A">终态：SUCCEEDED / FAILED / CANCELLED / EXPIRED；若 sideEffect=unknown 会先转 OUTCOME_UNKNOWN 对账。</text>
</svg>
