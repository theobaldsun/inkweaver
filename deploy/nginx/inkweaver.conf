# InkWeaver 单域名 Nginx 配置
# 安装：sudo cp deploy/nginx/inkweaver.conf /etc/nginx/sites-available/inkweaver
#        sudo ln -sf /etc/nginx/sites-available/inkweaver /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
# HTTPS：sudo certbot --nginx -d app.yourdomain.com

upstream inkweaver_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name app.yourdomain.com;

    client_max_body_size 20m;

    root /opt/inkweaver/web;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://inkweaver_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://inkweaver_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /sync/ {
        proxy_pass http://inkweaver_api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://inkweaver_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /healthz {
        proxy_pass http://inkweaver_api/healthz;
    }

    location /readyz {
        proxy_pass http://inkweaver_api/readyz;
    }
}
