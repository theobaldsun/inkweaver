# InkWeaver 单域名 + MinIO 存储子域 Nginx
# 域名：inkweaver.cn（主站）、storage.inkweaver.cn（MinIO 控制台/S3）
#
# 安装：
#   sudo cp deploy/nginx/inkweaver.cn.conf /etc/nginx/sites-available/inkweaver
#   sudo ln -sf /etc/nginx/sites-available/inkweaver /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d inkweaver.cn -d www.inkweaver.cn -d storage.inkweaver.cn -d s3.inkweaver.cn

upstream inkweaver_api {
    server 127.0.0.1:3000;
    keepalive 8;
}

upstream minio_api {
    server 127.0.0.1:9000;
    keepalive 4;
}

upstream minio_console {
    server 127.0.0.1:9001;
    keepalive 4;
}

# ---------- 主站：Web + API + WebSocket ----------
server {
    listen 80;
    server_name inkweaver.cn www.inkweaver.cn;

    client_max_body_size 20m;

    root /opt/inkweaver/web;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://inkweaver_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://inkweaver_api/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /sync/ {
        proxy_pass http://inkweaver_api/sync/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    location /socket.io/ {
        proxy_pass http://inkweaver_api/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /healthz {
        proxy_pass http://inkweaver_api/healthz;
    }

    location /readyz {
        proxy_pass http://inkweaver_api/readyz;
    }
}

# ---------- MinIO Web 控制台 ----------
server {
    listen 80;
    server_name storage.inkweaver.cn;

    client_max_body_size 100m;

    location / {
        proxy_pass http://minio_console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# ---------- MinIO S3 API（Cyberduck / rclone / aws cli）----------
server {
    listen 80;
    server_name s3.inkweaver.cn;

    client_max_body_size 100m;
    ignore_invalid_headers off;

    location / {
        proxy_pass http://minio_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;
    }
}
