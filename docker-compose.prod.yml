# InkWeaver 生产编排（单机：PostgreSQL + Redis + Nest + MinIO）
#
# 用法：
#   编辑根 .env.prod（见 docs/运维.md）
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# MinIO 控制台：https://storage.inkweaver.cn（需 DNS + Nginx）
# S3 API（Cyberduck/rclone）：https://storage.inkweaver.cn 或 http://127.0.0.1:9000

services:
  postgres:
    image: postgres:16-alpine
    container_name: inkweaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: syncbox_db
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
    volumes:
      - inkweaver_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d syncbox_db']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inkweaver_internal

  redis:
    image: redis:7-alpine
    container_name: inkweaver-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - inkweaver_internal

  minio:
    image: minio/minio:latest
    container_name: inkweaver-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - inkweaver_minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://127.0.0.1:9000/minio/health/live || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - inkweaver_internal

  minio-init:
    image: minio/mc:latest
    container_name: inkweaver-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb --ignore-existing local/inkweaver;
      mc anonymous set none local/inkweaver;
      echo 'MinIO bucket inkweaver ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - inkweaver_internal
    restart: 'no'

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: inkweaver-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: syncbox_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: inkweaver
      MINIO_USE_SSL: 'false'
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${UPLOADS_HOST_PATH:-/opt/inkweaver/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - inkweaver_internal

volumes:
  inkweaver_pg_data:
  inkweaver_minio_data:

networks:
  inkweaver_internal:
    driver: bridge
