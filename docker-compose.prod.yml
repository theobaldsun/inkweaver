# InkWeaver 生产编排（单机 ECS：PostgreSQL + Redis + Nest API）
#
# 用法：
#   cp deploy/env.prod.example .env.prod
#   编辑 .env.prod 填写密码、JWT、SMTP、域名
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 首次迁移：
#   docker compose -f docker-compose.prod.yml exec server node dist/scripts/run-migrations.js
#
# 仅绑定 127.0.0.1:3000，对外由 Nginx 反代。

services:
  postgres:
    image: postgres:16-alpine
    container_name: inkweaver-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: syncbox_db
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
    volumes:
      - inkweaver_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d syncbox_db']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inkweaver_internal

  redis:
    image: redis:7-alpine
    container_name: inkweaver-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.prod}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - inkweaver_internal

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: inkweaver-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE: syncbox_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ${UPLOADS_HOST_PATH:-./data/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inkweaver_internal

volumes:
  inkweaver_pg_data:

networks:
  inkweaver_internal:
    driver: bridge
