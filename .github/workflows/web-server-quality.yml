name: Web Server Quality

on:
  pull_request:
  push:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @inkweaver/web lint
      - run: pnpm --filter @inkweaver/server lint
      - run: pnpm --filter @inkweaver/api test
      - run: pnpm --filter @inkweaver/adapters test
      - run: pnpm --filter @inkweaver/web test
      - run: pnpm --filter @inkweaver/server test
      - run: pnpm --filter @inkweaver/web build
      - run: pnpm --filter @inkweaver/server build
      - name: Reject hard-coded production API URL
        run: '! grep -R "http://localhost:3000/api" apps/web/dist'
      - run: pnpm audit:web-server
      - run: git diff --check

  postgres-minio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test:integration
      - if: always()
        run: docker compose -f docker-compose.test.yml down -v
